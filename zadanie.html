<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Создание структуры HTML-страницы</title>
    </head>
    
    <body>
        <header>
            <h1>Заголовок страницы</h1>
        </header>
        
        <main>
            <section>
                <h2>Информация</h2>
                <p>Раздел о студенте</p>
            </section>
            
            <article>
                <h3>Статья</h3>
                <p>Текст статьи</p>
                <ul>
                    <li>Элемент 1</li>
                    <li>Элемент 2</li>
                    <li>Элемент 3</li>
                </ul>
            </article>
            <nav>
                <ul>
                    <li>Ссылка 1</li>
                    <li>Ссылка 2</li>
                    <li>Ссылка 3</li>
                </ul>
            </nav>
            <aside>
                <p>Боковая панель с информацией</p>
            </aside>
        </main>
        
        <footer>
            <p>&copy; 2025 г. Все права защищены</p>
        </footer>
    </body>
</html>
